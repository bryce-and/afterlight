<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Afterlight unit line-up</title>
</head>
<body>
<!-- Headless enemy model line-up, run by tools/unitshot.sh: ?units=vx_goblin,tk_vandal&loc=io&crit=1. Loads the real game in an
     iframe, then draws each unit with tools/unitshot.js lineup. Errors (unknown unit, a builder that throws) print in red at the top. -->
<pre id="result">running</pre>
<iframe id="f" src="../index.html" style="position:fixed;inset:0;width:100%;height:100%;border:0"></iframe>
<script>
const q = new URLSearchParams(location.search);
const f = document.getElementById('f');
f.addEventListener('load', async () => {
  const out = document.getElementById('result');
  try {
    await new Promise((r) => setTimeout(r, 1500));
    const res = await f.contentWindow.eval(`(async () => {
      const T = await import('/tools/unitshot.js');
      return T.lineup(${JSON.stringify((q.get('units') || '').split(',').filter(Boolean))}, { loc: ${JSON.stringify(q.get('loc') || 'io')}, crit: ${q.get('crit') === '1'} });
    })()`);
    out.textContent = JSON.stringify(res);
    out.style.display = 'none';
  } catch (e) { out.textContent = 'HARNESS ERROR ' + e.message; }
  document.body.dataset.done = '1';
});
</script>
</body>
</html>
