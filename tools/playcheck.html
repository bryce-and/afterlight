<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Afterlight play-check</title>
</head>
<body>
<!-- Headless play-check, run by tools/playcheck.sh: ?loc=moon&mi=0,1&tier=legendary&loadout=meta&exotic=Name. Loads the real game in an iframe and runs
     tools/playcheck.js for each mission (a bot with a meta loadout fights through every zone). -->
<pre id="result">running</pre>
<iframe id="f" src="../index.html" style="position:fixed;inset:0;width:100%;height:100%;border:0"></iframe>
<script>
const q = new URLSearchParams(location.search);
const LOC = q.get('loc'), MIS = (q.get('mi') || '0').split(',').map(Number);
const OPT = { tier: q.get('tier') || 'base', loadout: q.get('loadout') || 'meta', exotic: q.get('exotic') || null };
const f = document.getElementById('f');
f.addEventListener('load', async () => {
  const out = document.getElementById('result');
  try {
    await new Promise((r) => setTimeout(r, 1500));
    out.textContent = await f.contentWindow.eval(`(async () => {
      const P = await import('/tools/playcheck.js'), d = await import('/js/data.js');
      if (${JSON.stringify(LOC)} === 'horde') return await P.hordecheck(${JSON.stringify(MIS[0] || 6)}, { allBoons: ${JSON.stringify(OPT.loadout === 'allboons')} }); // U24: mi is the number of waves
      const li = d.LOCATIONS.findIndex((l) => l.id === ${JSON.stringify(LOC)}), lines = [];
      if (li < 0) return 'NO SUCH LOCATION ' + ${JSON.stringify(LOC)} + ' (have: ' + d.LOCATIONS.map((l) => l.id).join(', ') + ')';
      for (const mi of ${JSON.stringify(MIS)}) lines.push(await P.playcheck(li, mi, ${JSON.stringify(OPT)}));
      return lines.join('\\n');
    })()`);
  } catch (e) { out.textContent = 'HARNESS ERROR ' + e.message; }
  document.body.dataset.done = '1';
});
</script>
</body>
</html>
