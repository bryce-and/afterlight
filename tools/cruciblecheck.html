<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Afterlight Crucible check</title>
</head>
<body>
<!-- Headless Crucible check, run by tools/cruciblecheck.sh: ?mode=control (or duel). Loads the real game in an iframe and runs tools/cruciblecheck.js. -->
<pre id="result">running</pre>
<iframe id="f" src="../index.html" style="position:fixed;inset:0;width:100%;height:100%;border:0"></iframe>
<script>
const MODE = new URLSearchParams(location.search).get('mode') || 'control';
const f = document.getElementById('f');
f.addEventListener('load', async () => {
  const out = document.getElementById('result');
  try {
    await new Promise((r) => setTimeout(r, 1500));
    out.textContent = await f.contentWindow.eval(`(async () => { const C = await import('/tools/cruciblecheck.js'); return C.cruciblecheck(${JSON.stringify(MODE)}); })()`);
  } catch (e) { out.textContent = 'HARNESS ERROR ' + e.message; }
  document.body.dataset.done = '1';
});
</script>
</body>
</html>
