<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div id="crosshair"><span class="ch t"></span><span class="ch b"></span><span class="ch l"></span><span class="ch r"></span><span class="dot"></span></div>
  <div id="glaive-bar"><i></i></div>
  <div id="hitmarker"><span></span><span></span><span></span><span></span></div>
  <div id="scope" class="hidden"><div class="lens"></div></div>
  <div id="vignette"></div>
  <div id="crit-vignette"></div>
  <div id="super-vignette"></div>
  <div id="screen-flash"></div>
  <div id="dmg-dirs"></div>
  <div id="dmg-layer"></div>
  <div id="nameplates"></div>
  <div id="waypoint" class="hidden"><div class="wp-icon"></div><div class="wp-dist"></div></div>

  <div id="roster" class="hidden"></div>
  <div id="objective"><div class="obj-loc"></div><div class="obj-name"></div><div class="obj-text"></div></div>
  <div id="vitals">
    <div class="vbar"><div class="shield-fill"></div><div class="over-fill"></div></div>
    <div class="vbar health"><div class="health-fill"></div></div>
    <div id="revives"></div>
  </div>
  <div id="bossbar" class="hidden"><div class="boss-name"></div><div class="boss-track"><div class="boss-hp"></div><div class="boss-shield"></div></div></div>
  <div id="eplate" class="hidden"><div class="ep-ico"></div><div class="ep-body"><div class="ep-name"></div><div class="ep-track"><div class="ep-hp"></div></div><div class="ep-shield"></div><div class="ep-debuffs"></div></div></div>

  <div id="xpbar"><span class="xp-lvl"></span><div class="xp-track"><div class="xp-fill"></div></div></div>
  <div id="abilities">
    <div id="buffs-gen" class="buffs"></div>
    <div id="charge" class="hidden" title="Armor Charge"><span class="ch-ico">◈</span><span class="ch-name">Armor Charge</span><span class="ch-pips"></span><i class="ch-bar"></i></div>
    <div id="super"><div class="super-top"><span class="super-name"></span><span class="super-label"></span><kbd>F</kbd></div><div class="super-track"><div class="super-fill"></div></div></div>
    <div class="ab-row">
      <div class="ab" data-ab="grenade"><div class="ab-fill"></div><div class="ab-icon">◆</div><span class="ab-name"></span><kbd>Q</kbd></div>
      <div class="ab" data-ab="melee"><div class="ab-fill"></div><div class="ab-icon">✶</div><span class="ab-name"></span><kbd>V</kbd></div>
      <div class="ab" data-ab="class"><div class="ab-fill"></div><div class="ab-icon">▲</div><span class="ab-name"></span><kbd>C</kbd></div>
    </div>
    <div id="buffs-wpn" class="buffs"></div>
  </div>
  <div id="weapons"></div>
  <div id="reload-hint">RELOAD [R]</div>
  <div id="feed"></div>
  <div id="center-msg"><div class="cm-title"></div><div class="cm-sub"></div></div>
  <div id="end-timer" class="hidden"></div>
  <div id="prompt" class="hidden"></div>
  <div id="subtitle" class="hidden"><span class="st-who"></span><span class="st-text"></span></div>
  <div id="death" class="hidden"><svg class="d-skull" viewBox="0 0 64 64" aria-hidden="true"><path fill="currentColor" d="M32 6C19 6 10 15 10 27c0 7 3 12 8 15v8c0 2 2 4 4 4h3v-5h3v5h8v-5h3v5h3c2 0 4-2 4-4v-8c5-3 8-8 8-15C54 15 45 6 32 6zm-9 30a6 6 0 1 1 0-12 6 6 0 0 1 0 12zm18 0a6 6 0 1 1 0-12 6 6 0 0 1 0 12zm-9 8-4-6h8z"/></svg><div class="d-title">You Died</div><div class="d-sub"></div><div class="d-timer"></div></div>
  <div id="lock-hint" class="hidden">Click to capture the mouse</div>
</div>

<div id="title" class="screen">
  <div class="title-wrap">
    <div class="logo">AFTERLIGHT</div>
    <div class="tagline">A low-poly looter shooter</div>
    <div class="t-update" id="t-update"></div>
    <div class="t-hint">Click to begin</div>
    <div class="t-foot">Best with a mouse and keyboard. Headphones recommended.</div>
    <div class="t-links" id="t-links"><button class="btn" id="t-log">Update Log</button><button class="btn" id="t-road">Roadmap</button></div>
  </div>
  <div class="t-notice hidden" id="t-notice"></div>
  <div class="t-panel hidden" id="t-panel"></div>
</div>
<div id="classes" class="screen hidden"></div>
<div id="orbit" class="screen hidden"></div>
<div id="pause" class="screen overlay hidden"></div>
<div id="complete" class="screen overlay hidden"></div>
<div id="failed" class="screen overlay hidden"></div>

<noscript>Afterlight needs JavaScript to run.</noscript>
<script type="module">import './js/main.js';</script>
</body>
</html>
